<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>JS4 - Desafio 2</title>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
</head>
<body>
    <form name="datos" id="datos">
        <input type="number" name="id" placeholder="Código"> 
        <input type="text" name="nombre" placeholder="Nombre">
        <input type="number" name="precio" placeholder="Precio"> 
        <input type="number" name="cantidad" placeholder="Cantidad"> 
        <div class="checkbox-container">
            <input type="checkbox" name="exento" id="exento">
            <label for="exento">Exento</label>
        </div>
        <button type="button" id="btnAgregar">Agregar Producto</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Exento</th>
                <th>SubTotal</th>
            </tr>
        </thead>
        <tbody id="factura"></tbody>
    </table>
</body>
<script src="./script.js"></script>
</html>
